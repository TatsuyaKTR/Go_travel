<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ホテル一覧画面</title>
</head>
<body>
	<h1>Goatravel</h1>
	<table border="1">
		<tr>
			<th>NO</th>
			<th>ホテル名</th>
			<th>日付</th>
			<th>住所</th>
			<th>対応言語</th>
			<th>風呂タイプ</th>
			<th>最安値</th>
			<th>詳細</th>
		</tr>
		<tr th:each="accommodation : ${accommodations}">
			<td th:text="${accommodation.id}"></td>
			<td th:text="${accommodation.name}"></td>
			<td th:text="${accommodation.oldDate + ' ~ ' + accommodation.newDate}"></td>
			<td th:text="${accommodation.address}"></td>
			<td th:text="${accommodation.language.name}"></td>
			<td th:text="${accommodation.bathType.name}"></td>
			<td th:text="${accommodation.minPrice}"></td>
			<td th:text="${accommodation.content}"></td>			
		</tr>
	</table>
</body>
</html>
